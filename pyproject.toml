[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reporanger"
version = "0.2.0a6"
description = "Local and historical repository credential scanning with explainable risk reports"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
reporanger = "backend.application.cli:main"

[tool.setuptools.packages.find]
include = ["backend*"]
