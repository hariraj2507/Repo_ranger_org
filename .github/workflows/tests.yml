name: Tests and release
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.python }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - name: Verify the installed distribution outside the checkout
        working-directory: ${{ runner.temp }}
        shell: python {0}
        run: |
          import os, pathlib, subprocess, sys
          script = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'tests' / 'installed_smoke.py'
          subprocess.run([sys.executable, '-I', str(script)], check=True)
      - run: python -m unittest discover -s tests -v
      - run: python -m benchmarks.evaluate
      - name: Verify current independent release evidence
        run: python -m benchmarks.release_gate verify benchmarks/revision9/release-evidence.json
      - run: reporanger --help
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - name: Verify release version
        run: python -c "import os,tomllib; assert os.environ['GITHUB_REF_NAME'] == 'v' + tomllib.load(open('pyproject.toml','rb'))['project']['version']"
      - name: Enforce current evidence and stable readiness thresholds
        run: |
          python - <<'PY'
          import re, subprocess, sys, tomllib
          version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          command = [sys.executable, '-m', 'benchmarks.release_gate', 'verify',
                     'benchmarks/revision9/release-evidence.json']
          if re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version):
              command.append('--require-ready')
          subprocess.run(command, check=True)
          PY
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* models/*.json MODEL_CARD.md --verify-tag --prerelease --title "RepoRanger $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
