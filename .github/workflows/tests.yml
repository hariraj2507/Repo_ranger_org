name: Tests and release
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python -m benchmarks.evaluate
      - run: reporanger --help
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - name: Verify release version
        run: python -c "import os,tomllib; assert os.environ['GITHUB_REF_NAME'] == 'v' + tomllib.load(open('pyproject.toml','rb'))['project']['version']"
      - name: Enforce minimum evidence for stable version tags
        run: |
          python -c "import re,subprocess,tomllib; version=tomllib.load(open('pyproject.toml','rb'))['project']['version']; subprocess.run(['python','-m','benchmarks.readiness','benchmarks/revision6/final/current.json','--require-ready'],check=True) if re.fullmatch(r'[0-9]+[.][0-9]+[.][0-9]+',version) else print('Alpha release: production gate remains informational')"
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* models/*.json MODEL_CARD.md --verify-tag --prerelease --title "RepoRanger $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
